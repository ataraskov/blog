name: Build and Publish
run-name: ${{ github.actor }} build and publish site
on:
  push:
    branches:
      - 'main'
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Setup keys
        run: |
          mkdir -m 700 ~/.ssh
          echo "${{ github.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/*
          ssh-keyscan -p 2222 git.quiet.rocks >~/.ssh/authorized_keys
      - name: Check out repository code
        uses: actions/checkout@v3
          with:
            ssh-key: ~/.ssh/id_ed25519
            submodules: true
      - name: Install and Run hugo
        run: |
          cd ${{ github.workspace }}
          curl -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v0.112.5/hugo_extended_0.112.5_linux-amd64.deb"
          dpkg -i hugo deb
          hugo
      - name: Publish
        run: |
          rsync -hrvz --delete --exclude=_ -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" --progress public/ ubuntu@ataraskov.dev:/srv/caddy/site/

