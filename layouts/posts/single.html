{{ define "main" }}

<section id="main">
  <h4 id="title">{{ .Title }}</h1>
  <div>
    <!-- content -->
    <article id="content">
      {{ .Content }}
    <!-- meta -->
    <p>{{ .Date.Format "Mon Jan 2, 2006" }} / {{ .WordCount }} words /
    {{ with .GetTerms "tags" }}
        {{ range . }}
          <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
        {{ end }}
    {{ end }}
    </p>
    </article>
  </div>
</section>
{{ end }}
