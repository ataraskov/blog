baseURL = "https://ataraskov.dev"
title = "Tech enthusiast's blog"
languageCode = "en-us"
theme = "devise"
relativeURLs = true
enableEmoji = true
enableRobotsTXT = true
copyright = "&copy; Copyright 2023, ataraskov.dev"

# Main menu items
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    title = "Posts"
    url = "/posts/"
    weight = -110
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    title = "Tags"
    url = "/tags/"
    weight = -105
  [[menu.main]]
    identifier = "about"
    name = "About"
    title = "About"
    url = "/about/"
    weight = -100
#  [[menu.main]]
#    identifier = "categories"
#    name = "Categories"
#    title = "Categories"
#    url = "/categories/"
#    weight = -90

# Configuration Features
[params]
  description = "Tech enthusiast's blog"     # Your meta description of the site
  header_title = "ataraskov.dev"             # Your header title
  header_subtitle = "About everything and nothing" # Your header subtitle
  home_image = "img/avatar.png"              # Path to header image starting from the static directory (optional)
  recent_posts = 5                           # Max amount of recent posts to show
  mainSections = ["posts", "post", "blog"]   # Main sections to include in recent posts
  [[params.social]]
    fa_icon = "fab fa-github fa-1x"          # Font Awesome icon class
    href = "http://github.com/ataraskov"     # Link to associate with icon (http://, https://, mailto:)
  [[params.social]]
    fa_icon = "fab fa-linkedin-in fa-1x"
    href = "https://www.linkedin.com/in/ataraskov"